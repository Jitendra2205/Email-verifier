services:
  - type: web
    name: email-verifier
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # No persistent disk on the free plan — no card on file, no billing.
    # Trade-off: server/data (the SQLite file and any uploaded-but-unprocessed
    # rows) lives on the container's ephemeral filesystem. It is wiped on every
    # redeploy, and on a restart after the free plan's idle sleep. Fine for a
    # reviewer clicking through the app; not a place to leave a real run.
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_USER
        value: marketing
      # Set these in the Render dashboard — never commit them.
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: RETENTION_DAYS
        value: "7"
      # Outbound port 25 is blocked on Render, so this cannot work there anyway.
      - key: SMTP_PROBE_ENABLED
        value: "false"
